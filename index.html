<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>청자골 아학-교과서 어휘력 카드</title>
<style>
:root{--p:#2E7D6E;--bg:#EEF4F1;--ink:#1B2B33;--mut:#5C6F76;--bd:#D3E0DA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:20px}
main{max-width:520px;width:100%;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:28px 24px;text-align:center}
h1{margin:0 0 6px;font-size:24px}
p{color:var(--mut);line-height:1.7;margin:8px 0}
a.btn{display:block;margin:18px 0 6px;padding:16px;border-radius:12px;background:var(--p);color:#fff;font-size:19px;font-weight:700;text-decoration:none}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>청자골 아학-교과서 어휘력 카드</h1>
  <p>초등 3~6학년 교과서 어휘를 한자·음훈·뜻·예시와 함께 익히고 퀴즈로 확인해요.</p>
  <a class="btn" href="teacher/">교사 배포도구 (teacher)</a>
  <a class="btn" href="app/">교과서 어휘력편 (app)</a>
  <p><small>학교·학년·학기·과목별 출판사를 고르면 그 어휘만 모아 보여 주는 학습 앱이에요.</small></p>
  <p><small>선생님이 학교·학년·학급·과목별 출판사를 고르고 <b>배포</b>하면<br>학생용 링크(student-…)와 QR이 만들어져요.</small></p>
  <p><small>학생은 선생님이 알려 준 링크나 QR로 접속해 주세요.</small></p>
</main>
</body>
</html>
